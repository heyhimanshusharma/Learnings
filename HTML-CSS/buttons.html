<style>
    .subscribe-button {
        background-color: ff0033;
        color: white;

        padding-top: 10px;
        border-radius: 30px;
        cursor: pointer;
        margin-right: 6px;
        margin-left: 6px;
        transition: hover 0.15s;
    }

    .join-button {
        background-color: rgb(255, 255, 255);
        border-color: rgb(0, 71, 130);
        color: rgb(0, 71, 130);
        border-style: solid;
        height: 36px;
        width: 60px;
        border-radius: 2px;
        cursor: pointer;
        margin: 8px;
        transition: background-color 1s, color 1s;
    }

    .subscribe-button:hover{
        opacity: 0.8;
    }

    .subscribe-button:active{

    }

    .join-button:hover{
        background-color: rgb(0, 71, 130);

    }

    .join-button:active{
        opacity: 0.7;
    }

        color: white;

        border-radius: 40px;

        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
        transition: box-shadow 1s;
    }

    .tweet-button:hover {
        box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.15);
    }
</style>

</button>

</button>
